<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penggajian Driver OmNigo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#e1e4ea;--ac:#2f5bea;--ac2:#e8eeff;--rd:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mu:#98a1b3;--bd:#2d3441;--ac:#6c8cff;--ac2:#252d45;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mu:#98a1b3;--bd:#2d3441;--ac:#6c8cff;--ac2:#252d45;--rd:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
nav button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
button{cursor:pointer}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{color:var(--rd);padding:3px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row label{color:var(--mu);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--ac2);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.15rem}.stat span{color:var(--mu);font-size:.8rem}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu)}td.n,th.n{text-align:right}
tr.t td{font-weight:700}
.cv{position:relative;height:280px}
.slip div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}
.slip div:last-child{border:0;font-weight:700;font-size:1.1rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.g2 label{display:block;color:var(--mu);font-size:.8rem}.g2 input{width:100%}
</style>
</head>
<body>
<main>
<h1>Penggajian Driver OmNigo</h1>
<p class="sub">Periode Oktober 2026. Data simulasi dari file revisi; perubahan tersimpan di browser ini.</p>
<nav id="nav"></nav>
<section id="v"></section>
</main>
<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const DEF=()=>({
 drivers:[["WD001","Bambang Yadi","OJ"],["WD003","Windah Saur","OJ"],["WD005","Rizky Ilahi","MB"],["WD009","Clarrissa","MB"],["WD008","Rohmat loby","OJ"],["WD010","Zora Maudy","FD"],["WD060","Fajar Maulana","FD"],["WD011","Rina Strawberry","OJ"]].map(([id,n,k])=>({id,n,k})),
 trx:[["WD001",65,4.9],["WD003",105,4.9],["WD005",85,4.9],["WD009",72,4.8],["WD008",110,4.8],["WD010",130,4.9],["WD060",95,4.7],["WD011",90,4.8]].map(([d,o,r],i)=>({id:"TRX00"+(i+1),tgl:"2026-10-01",d,o,r})),
 svc:{OJ:{n:"Ojek online / motor",t:20000,i:2000000,g:100},MB:{n:"Mobil online",t:35000,i:2800000,g:80},FD:{n:"Food delivery",t:15000,i:1800000,g:120}},
 par:{bonus:100000,rmin:4.8,adm:50000,den:5000,dmin:70}
});
let S=DEF(),tab="Dashboard",ch=null,sel="",fl="";
try{const x=localStorage.getItem("omnigo-v1");if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("omnigo-v1",JSON.stringify(S))}catch(e){}};

function calc(){return S.drivers.map(d=>{
 const sv=S.svc[d.k]||{n:"-",t:0,i:0,g:1},T=S.trx.filter(x=>x.d===d.id);
 const o=T.reduce((a,x)=>a+x.o,0),r=T.length?T.reduce((a,x)=>a+x.r,0)/T.length:0;
 const ok=o>=sv.g,base=o*sv.t,inc=ok?sv.i:0,bon=ok&&r>=S.par.rmin?S.par.bonus:0,den=o<S.par.dmin?S.par.den:0,adm=S.par.adm;
 return{...d,sv,o,r,base,inc,bon,adm,den,net:base+inc+bon-adm-den,pct:o/sv.g,
  ev:ok?(r>=S.par.rmin?"Target tercapai; pertahankan kinerja":"Perlu meningkatkan rating layanan"):"Perlu meningkatkan jumlah order"}})}

function tbl(h,rows,nums=[],foot){
 const c=(v,i)=>`<td class="${nums.includes(i)?"n":""}">${v}</td>`;
 return `<table><tr>${h.map((x,i)=>`<th class="${nums.includes(i)?"n":""}">${x}</th>`).join("")}</tr>`+
  rows.map(r=>`<tr>${r.map(c).join("")}</tr>`).join("")+(foot?`<tr class="t">${foot.map(c).join("")}</tr>`:"")+`</table>`}
const opt=(a,v)=>a.map(([k,t])=>`<option value="${E(k)}"${k===v?" selected":""}>${E(t)}</option>`).join("");
const drvOpt=v=>opt(S.drivers.map(d=>[d.id,d.id+" - "+d.n]),v);

const V={
Dashboard(){const c=calc(),sum=k=>c.reduce((a,x)=>a+x[k],0);
 return `<div class="stats">${[["Jumlah driver",c.length],["Total order/trip",sum("o")],["Total pendapatan bersih",rp(sum("net"))],["Total insentif",rp(sum("inc"))]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("")}</div>
 <div class="card"><h2>Pendapatan bersih per driver</h2><div class="cv"><canvas id="ch"></canvas></div></div>
 <div class="card"><h2>Analisis kinerja</h2><div class="sc">${tbl(["Driver","Order","Target","Capaian","Rating","Evaluasi"],c.map(x=>[E(x.n),x.o,x.sv.g,Math.round(x.pct*100)+"%",x.r.toFixed(1),E(x.ev)]),[1,2,3,4])}</div></div>`},
Driver(){return `<div class="card"><h2>Tambah driver</h2><div class="row">
 <input id="fi" placeholder="ID (mis. WD012)" size="12"><input id="fn" placeholder="Nama driver" size="18">
 <select id="fk">${opt(Object.entries(S.svc).map(([k,v])=>[k,v.n]))}</select>
 <button class="p" data-a="addD">Tambah</button></div><div class="sub" id="m"></div>
 <div class="sc">${tbl(["ID","Nama","Layanan",""],S.drivers.map(d=>[E(d.id),E(d.n),E((S.svc[d.k]||{}).n||"-"),`<button class="x" data-a="delD" data-i="${E(d.id)}">Hapus</button>`]))}</div></div>`},
Transaksi(){return `<div class="card"><h2>Tambah transaksi</h2><div class="row">
 <input id="ft" type="date" value="2026-10-01"><select id="fd">${drvOpt()}</select>
 <input id="fo" type="number" min="1" placeholder="Jumlah order" style="width:130px"><input id="fr" type="number" min="1" max="5" step="0.1" placeholder="Rating" style="width:90px">
 <button class="p" data-a="addT">Tambah</button></div><div class="sub" id="m"></div>
 <div class="sc">${tbl(["ID","Tanggal","Driver","Order","Rating",""],S.trx.map(t=>[E(t.id),E(t.tgl),E(t.d),t.o,t.r,`<button class="x" data-a="delT" data-i="${E(t.id)}">Hapus</button>`]),[3,4])}</div></div>`},
Payroll(){const c=calc(),s=k=>c.reduce((a,x)=>a+x[k],0);
 return `<div class="card"><h2>Payroll bulanan</h2><p class="sub">Bersih = Dasar + Insentif + Bonus − Admin − Denda</p><div class="sc">${tbl(["Driver","Layanan","Order","Dasar","Insentif","Bonus","Admin","Denda","Bersih"],
 c.map(x=>[E(x.n),E(x.sv.n),x.o,rp(x.base),rp(x.inc),rp(x.bon),rp(x.adm),rp(x.den),rp(x.net)]),[2,3,4,5,6,7,8],
 ["TOTAL","",s("o"),rp(s("base")),rp(s("inc")),rp(s("bon")),rp(s("adm")),rp(s("den")),rp(s("net"))])}</div></div>`},
"Slip Gaji"(){const c=calc();if(!c.length)return `<div class="card">Belum ada driver.</div>`;
 const x=c.find(d=>d.id===sel)||c[0];sel=x.id;
 const L=[["Nama driver",E(x.n)],["Jenis layanan",E(x.sv.n)],["Total order/trip",x.o],["Rating rata-rata",x.r.toFixed(1)],["Pendapatan dasar",rp(x.base)],["Insentif",rp(x.inc)],["Bonus target",rp(x.bon)],["Potongan admin",rp(x.adm)],["Denda",rp(x.den)],["PENDAPATAN BERSIH",rp(x.net)]];
 return `<div class="card"><h2>Slip gaji digital</h2><div class="row"><label>Pilih driver</label><select id="ss">${drvOpt(sel)}</select><button data-a="cp">Salin slip</button><span class="sub" id="m" style="margin:0"></span></div>
 <div class="slip"><div><span>Periode</span><span>Oktober 2026</span></div>${L.map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join("")}</div></div>`},
Pengaturan(){const P=S.par,i=(a,l,v,st="1")=>`<div><label>${l}</label><input type="number" step="${st}" ${a} value="${v}"></div>`;
 return `<div class="card"><h2>Tarif dan target per layanan</h2><div class="g2">${Object.entries(S.svc).map(([k,v])=>`<div class="card" style="margin:0"><b>${E(v.n)}</b><div style="margin-top:8px">${i(`data-s="${k}.t"`,"Tarif per order (Rp)",v.t)}${i(`data-s="${k}.i"`,"Insentif target (Rp)",v.i)}${i(`data-s="${k}.g"`,"Target order/bulan",v.g)}</div></div>`).join("")}</div></div>
 <div class="card"><h2>Parameter payroll</h2><div class="g2">${i('data-p="bonus"',"Bonus target (Rp)",P.bonus)}${i('data-p="rmin"',"Rating minimum bonus",P.rmin,"0.1")}${i('data-p="adm"',"Potongan admin (Rp)",P.adm)}${i('data-p="den"',"Denda (Rp)",P.den)}${i('data-p="dmin"',"Denda jika order di bawah",P.dmin)}</div>
 <div class="row" style="margin:12px 0 0"><button data-a="rs">Kembalikan data awal</button></div></div>`}
};

function render(){
 $("nav").innerHTML=Object.keys(V).map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");
 $("v").innerHTML=V[tab]();
 if(fl&&$("m")){$("m").textContent=fl}fl="";
 if(ch){ch.destroy();ch=null}
 if(tab==="Dashboard"){
  const c=calc(),cs=getComputedStyle(document.documentElement),tx=cs.getPropertyValue("--mu").trim(),bd=cs.getPropertyValue("--bd").trim(),ac=cs.getPropertyValue("--ac").trim();
  ch=new Chart($("ch"),{type:"bar",data:{labels:c.map(x=>x.n),datasets:[{label:"Pendapatan bersih (Rp)",data:c.map(x=>x.net),backgroundColor:ac}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tx},grid:{color:bd}},y:{ticks:{color:tx},grid:{color:bd}}}}});
 }}

$("nav").onclick=e=>{const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;render()}};
$("v").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="addD"){const id=$("fi").value.trim().toUpperCase(),n=$("fn").value.trim();
  if(!id||!n)fl="Isi ID dan nama driver.";else if(S.drivers.some(d=>d.id===id))fl="ID sudah dipakai.";
  else{S.drivers.push({id,n,k:$("fk").value});fl="Driver ditambahkan."}}
 else if(a==="delD"){S.drivers=S.drivers.filter(d=>d.id!==b.dataset.i);S.trx=S.trx.filter(t=>t.d!==b.dataset.i)}
 else if(a==="addT"){const o=parseInt($("fo").value),r=parseFloat($("fr").value),d=$("fd").value;
  if(!d||!(o>0)||!(r>=1&&r<=5))fl="Isi driver, jumlah order (>0), dan rating (1 sampai 5).";
  else{const n=Math.max(0,...S.trx.map(t=>parseInt(t.id.slice(3))||0))+1;S.trx.push({id:"TRX"+String(n).padStart(3,"0"),tgl:$("ft").value,d,o,r});fl="Transaksi ditambahkan."}}
 else if(a==="delT"){S.trx=S.trx.filter(t=>t.id!==b.dataset.i)}
 else if(a==="rs"){S=DEF();fl=""}
 else if(a==="cp"){const x=calc().find(d=>d.id===sel);if(!x)return;
  const t=["SLIP GAJI DIGITAL - OMNIGO","Periode: Oktober 2026","Nama: "+x.n,"Layanan: "+x.sv.n,"Order/trip: "+x.o,"Pendapatan dasar: "+rp(x.base),"Insentif: "+rp(x.inc),"Bonus: "+rp(x.bon),"Potongan admin: "+rp(x.adm),"Denda: "+rp(x.den),"PENDAPATAN BERSIH: "+rp(x.net)].join("\n");
  const m=$("m");try{navigator.clipboard.writeText(t).then(()=>m.textContent="Slip tersalin.",()=>m.textContent="Gagal menyalin.")}catch(err){m.textContent="Gagal menyalin."}return}
 save();render()});
$("v").addEventListener("change",e=>{const t=e.target;
 if(t.id==="ss"){sel=t.value;render();return}
 if(t.dataset.p)S.par[t.dataset.p]=+t.value;
 else if(t.dataset.s){const[k,f]=t.dataset.s.split(".");S.svc[k][f]=+t.value}
 else return;save()});
render();
</script>
</body>
</html>

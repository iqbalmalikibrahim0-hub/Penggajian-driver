
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPAD OmNigo - Sistem Informasi Penggajian Driver</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;color:#222;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hide{display:none!important}
button,select,input{font:inherit;border:1px solid #cfd6e2;border-radius:4px;padding:7px 10px;max-width:100%;background:#fff;color:#222}
button{cursor:pointer}
button.p{background:#1e5bb8;border-color:#1e5bb8;color:#fff}
button.x{color:#c62828;padding:2px 8px}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0d3b82,#1e5bb8)}
.lc{background:#fff;border-radius:8px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
.lc h1{font-size:1.25rem;margin:8px 0 2px;color:#0d3b82}
.lc p{margin:0 0 16px;color:#667;font-size:.85rem}
.lc input{width:100%;margin-bottom:10px}
.lc button{width:100%;padding:10px}
.lc .er{color:#c62828;font-size:.85rem;min-height:20px}
.lg0{font-size:2.4rem}
header{position:fixed;top:0;left:0;right:0;z-index:20;background:#0d3b82;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);height:calc(52px + env(safe-area-inset-top,0px))}
header b{font-size:1.05rem}header .sp{flex:1}
header button{background:transparent;color:#fff;border-color:#ffffff66}
#un{font-size:.85rem}
aside{position:fixed;z-index:15;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;left:0;width:232px;background:#1c2b4a;color:#cfd8ea;overflow-y:auto;transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none}
.pf{padding:16px;border-bottom:1px solid #2c3d63;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:#1e5bb8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.pf small{display:block;color:#8fa0c4}
.mh{padding:12px 16px 4px;font-size:.72rem;letter-spacing:.08em;color:#7f90b5}
aside a{display:block;padding:11px 16px;color:#cfd8ea;text-decoration:none;border-left:3px solid transparent}
aside a.on{background:#243659;border-left-color:#4f9cff;color:#fff}
#ov{position:fixed;inset:0;background:#0006;z-index:10}
main{padding:calc(68px + env(safe-area-inset-top,0px)) 14px 14px}
@media(min-width:900px){aside{transform:none}main{margin-left:232px;padding-left:20px;padding-right:20px}#mb,#ov{display:none!important}}
.bc{color:#778;font-size:.82rem}
h1.pt{font-size:1.3rem;margin:2px 0 14px;color:#0d3b82}
.card{background:#fff;border:1px solid #dde3ee;border-top:3px solid #1e5bb8;border-radius:4px;margin-bottom:14px}
.card h2{font-size:.98rem;margin:0;padding:10px 14px;border-bottom:1px solid #e6ebf3}
.cb{padding:14px}
.sub{color:#667;font-size:.85rem;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{color:#fff;border-radius:4px;padding:12px 14px}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.82rem;opacity:.9}
.b1{background:#1e5bb8}.b2{background:#2e9d5b}.b3{background:#e69a1a}.b4{background:#c94a4a}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row label{color:#667;font-size:.85rem}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th{background:#1e5bb8;color:#fff;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #e6ebf3;white-space:nowrap}
tr:nth-child(even) td{background:#f6f8fc}
td.n,th.n{text-align:right}
tr.t td{font-weight:700;background:#e8eefb}
.cv{position:relative;height:280px}
.slip div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #cfd6e2}
.slip div:last-child{border:0;font-weight:700;font-size:1.05rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.g2 label{display:block;color:#667;font-size:.8rem}.g2 input{width:100%}
footer{color:#889;font-size:.78rem;text-align:center;padding:8px}
</style>
</head>
<body>
<div id="login" class="lg"><div class="lc">
<div class="lg0">🛵</div><h1>SIPAD OmNigo</h1><p>Sistem Informasi Penggajian Driver</p>
<input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
<div class="er" id="le"></div><button class="p" id="lb">Masuk</button>
<p style="margin:14px 0 0">Akun demo: admin / admin123</p>
</div></div>
<div id="app" class="hide">
<header><button id="mb">☰</button><b>SIPAD OmNigo</b><span class="sp"></span><span id="un">Administrator</span><button id="out">Keluar</button></header>
<aside id="sb"><div class="pf"><div class="av">A</div><div>Administrator<small>Admin Payroll</small></div></div><div class="mh">MENU UTAMA</div><div id="nav"></div></aside>
<div id="ov" class="hide"></div>
<main><div class="bc" id="bc"></div><h1 class="pt" id="pt"></h1><section id="v"></section><footer>© 2026 OmNigo. Data simulasi untuk tugas.</footer></main>
</div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const IC={"Dashboard":"🏠","Driver":"👤","Transaksi":"🧾","Payroll":"💰","Slip Gaji":"📄","Pengaturan":"⚙️"};
const DEF=()=>({
 drivers:[["WD001","Bambang Yadi","OJ"],["WD003","Windah Saur","OJ"],["WD005","Rizky Ilahi","MB"],["WD009","Clarrissa","MB"],["WD008","Rohmat loby","OJ"],["WD010","Zora Maudy","FD"],["WD060","Fajar Maulana","FD"],["WD011","Rina Strawberry","OJ"]].map(([id,n,k])=>({id,n,k})),
 trx:[["WD001",65,4.9],["WD003",105,4.9],["WD005",85,4.9],["WD009",72,4.8],["WD008",110,4.8],["WD010",130,4.9],["WD060",95,4.7],["WD011",90,4.8]].map(([d,o,r],i)=>({id:"TRX00"+(i+1),tgl:"2026-10-01",d,o,r})),
 svc:{OJ:{n:"Ojek online / motor",t:20000,i:2000000,g:100},MB:{n:"Mobil online",t:35000,i:2800000,g:80},FD:{n:"Food delivery",t:15000,i:1800000,g:120}},
 par:{bonus:100000,rmin:4.8,adm:50000,den:5000,dmin:70}
});
let S=DEF(),tab="Dashboard",ch=null,sel="",fl="";
try{const x=localStorage.getItem("omnigo-v1");if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("omnigo-v1",JSON.stringify(S))}catch(e){}};

function calc(){return S.drivers.map(d=>{
 const sv=S.svc[d.k]||{n:"-",t:0,i:0,g:1},T=S.trx.filter(x=>x.d===d.id);
 const o=T.reduce((a,x)=>a+x.o,0),r=T.length?T.reduce((a,x)=>a+x.r,0)/T.length:0;
 const ok=o>=sv.g,base=o*sv.t,inc=ok?sv.i:0,bon=ok&&r>=S.par.rmin?S.par.bonus:0,den=o<S.par.dmin?S.par.den:0,adm=S.par.adm;
 return{...d,sv,o,r,base,inc,bon,adm,den,net:base+inc+bon-adm-den,pct:o/sv.g,
  ev:ok?(r>=S.par.rmin?"Target tercapai; pertahankan kinerja":"Perlu meningkatkan rating layanan"):"Perlu meningkatkan jumlah order"}})}

function tbl(h,rows,nums=[],foot){
 const c=(v,i)=>`<td class="${nums.includes(i)?"n":""}">${v}</td>`;
 return `<table><tr>${h.map((x,i)=>`<th class="${nums.includes(i)?"n":""}">${x}</th>`).join("")}</tr>`+
  rows.map(r=>`<tr>${r.map(c).join("")}</tr>`).join("")+(foot?`<tr class="t">${foot.map(c).join("")}</tr>`:"")+`</table>`}
const opt=(a,v)=>a.map(([k,t])=>`<option value="${E(k)}"${k===v?" selected":""}>${E(t)}</option>`).join("");
const drvOpt=v=>opt(S.drivers.map(d=>[d.id,d.id+" - "+d.n]),v);
const P=(t,b)=>`<div class="card"><h2>${t}</h2><div class="cb">${b}</div></div>`;

const V={
Dashboard(){const c=calc(),sum=k=>c.reduce((a,x)=>a+x[k],0);
 return `<div class="stats">${[["Jumlah driver",c.length],["Total order/trip",sum("o")],["Pendapatan bersih",rp(sum("net"))],["Total insentif",rp(sum("inc"))]].map(([k,v],i)=>`<div class="stat b${i+1}"><b>${v}</b><span>${k}</span></div>`).join("")}</div>`+
 P("Pendapatan bersih per driver",`<div class="cv"><canvas id="ch"></canvas></div>`)+
 P("Analisis kinerja driver",`<div class="sc">${tbl(["Driver","Order","Target","Capaian","Rating","Evaluasi"],c.map(x=>[E(x.n),x.o,x.sv.g,Math.round(x.pct*100)+"%",x.r.toFixed(1),E(x.ev)]),[1,2,3,4])}</div>`)},
Driver(){return P("Tambah driver",`<div class="row"><input id="fi" placeholder="ID (mis. WD012)" size="12"><input id="fn" placeholder="Nama driver" size="18">
 <select id="fk">${opt(Object.entries(S.svc).map(([k,v])=>[k,v.n]))}</select><button class="p" data-a="addD">Tambah</button></div><div class="sub" id="m"></div>`)+
 P("Data driver",`<div class="sc">${tbl(["ID","Nama","Layanan",""],S.drivers.map(d=>[E(d.id),E(d.n),E((S.svc[d.k]||{}).n||"-"),`<button class="x" data-a="delD" data-i="${E(d.id)}">Hapus</button>`]))}</div>`)},
Transaksi(){return P("Tambah transaksi",`<div class="row"><input id="ft" type="date" value="2026-10-01"><select id="fd">${drvOpt()}</select>
 <input id="fo" type="number" min="1" placeholder="Jumlah order" style="width:130px"><input id="fr" type="number" min="1" max="5" step="0.1" placeholder="Rating" style="width:90px">
 <button class="p" data-a="addT">Tambah</button></div><div class="sub" id="m"></div>`)+
 P("Data transaksi",`<div class="sc">${tbl(["ID","Tanggal","Driver","Order","Rating",""],S.trx.map(t=>[E(t.id),E(t.tgl),E(t.d),t.o,t.r,`<button class="x" data-a="delT" data-i="${E(t.id)}">Hapus</button>`]),[3,4])}</div>`)},
Payroll(){const c=calc(),s=k=>c.reduce((a,x)=>a+x[k],0);
 return P("Payroll bulanan - Oktober 2026",`<p class="sub">Bersih = Dasar + Insentif + Bonus - Admin - Denda</p><div class="sc">${tbl(["Driver","Layanan","Order","Dasar","Insentif","Bonus","Admin","Denda","Bersih"],
 c.map(x=>[E(x.n),E(x.sv.n),x.o,rp(x.base),rp(x.inc),rp(x.bon),rp(x.adm),rp(x.den),rp(x.net)]),[2,3,4,5,6,7,8],
 ["TOTAL","",s("o"),rp(s("base")),rp(s("inc")),rp(s("bon")),rp(s("adm")),rp(s("den")),rp(s("net"))])}</div>`)},
"Slip Gaji"(){const c=calc();if(!c.length)return P("Slip gaji","Belum ada driver.");
 const x=c.find(d=>d.id===sel)||c[0];sel=x.id;
 const L=[["Nama driver",E(x.n)],["Jenis layanan",E(x.sv.n)],["Total order/trip",x.o],["Rating rata-rata",x.r.toFixed(1)],["Pendapatan dasar",rp(x.base)],["Insentif",rp(x.inc)],["Bonus target",rp(x.bon)],["Potongan admin",rp(x.adm)],["Denda",rp(x.den)],["PENDAPATAN BERSIH",rp(x.net)]];
 return P("Slip gaji digital",`<div class="row"><label>Pilih driver</label><select id="ss">${drvOpt(sel)}</select><button data-a="cp">Salin slip</button><span class="sub" id="m" style="margin:0"></span></div>
 <div class="slip"><div><span>Periode</span><span>Oktober 2026</span></div>${L.map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join("")}</div>`)},
Pengaturan(){const Q=S.par,i=(a,l,v,st="1")=>`<div><label>${l}</label><input type="number" step="${st}" ${a} value="${v}"></div>`;
 return P("Tarif dan target per layanan",`<div class="g2">${Object.entries(S.svc).map(([k,v])=>`<div><b>${E(v.n)}</b>${i(`data-s="${k}.t"`,"Tarif per order (Rp)",v.t)}${i(`data-s="${k}.i"`,"Insentif target (Rp)",v.i)}${i(`data-s="${k}.g"`,"Target order/bulan",v.g)}</div>`).join("")}</div>`)+
 P("Parameter payroll",`<div class="g2">${i('data-p="bonus"',"Bonus target (Rp)",Q.bonus)}${i('data-p="rmin"',"Rating minimum bonus",Q.rmin,"0.1")}${i('data-p="adm"',"Potongan admin (Rp)",Q.adm)}${i('data-p="den"',"Denda (Rp)",Q.den)}${i('data-p="dmin"',"Denda jika order di bawah",Q.dmin)}</div>
 <div class="row" style="margin:12px 0 0"><button data-a="rs">Kembalikan data awal</button></div>`)}
};

function render(){
 $("nav").innerHTML=Object.keys(V).map(t=>`<a href="#" class="${t===tab?"on":""}" data-t="${t}">${IC[t]}  ${t}</a>`).join("");
 $("pt").textContent=tab;$("bc").textContent="Beranda / "+tab;
 $("v").innerHTML=V[tab]();
 if(fl&&$("m")){$("m").textContent=fl}fl="";
 if(ch){ch.destroy();ch=null}
 if(tab==="Dashboard"){const c=calc();
  ch=new Chart($("ch"),{type:"bar",data:{labels:c.map(x=>x.n),datasets:[{label:"Pendapatan bersih (Rp)",data:c.map(x=>x.net),backgroundColor:"#1e5bb8"}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#555"},grid:{color:"#e5e7eb"}},y:{ticks:{color:"#555"},grid:{color:"#e5e7eb"}}}}});
 }}
const side=o=>{$("sb").classList.toggle("open",o);$("ov").classList.toggle("hide",!o)};
let ss=false;try{ss=sessionStorage.getItem("sipad")==="1"}catch(e){}
function show(on){$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on);if(on)render()}
function login(){if($("lu").value.trim()==="admin"&&$("lp").value==="admin123"){try{sessionStorage.setItem("sipad","1")}catch(e){}$("le").textContent="";show(true)}else $("le").textContent="Username atau password salah."}
$("lb").onclick=login;$("lp").onkeydown=e=>{if(e.key==="Enter")login()};
$("out").onclick=()=>{try{sessionStorage.removeItem("sipad")}catch(e){}$("lp").value="";side(false);show(false)};
$("mb").onclick=()=>side(!$("sb").classList.contains("open"));$("ov").onclick=()=>side(false);
$("nav").onclick=e=>{const b=e.target.closest("[data-t]");if(b){e.preventDefault();tab=b.dataset.t;side(false);render();scrollTo(0,0)}};
$("v").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="addD"){const id=$("fi").value.trim().toUpperCase(),n=$("fn").value.trim();
  if(!id||!n)fl="Isi ID dan nama driver.";else if(S.drivers.some(d=>d.id===id))fl="ID sudah dipakai.";
  else{S.drivers.push({id,n,k:$("fk").value});fl="Driver ditambahkan."}}
 else if(a==="delD"){S.drivers=S.drivers.filter(d=>d.id!==b.dataset.i);S.trx=S.trx.filter(t=>t.d!==b.dataset.i)}
 else if(a==="addT"){const o=parseInt($("fo").value),r=parseFloat($("fr").value),d=$("fd").value;
  if(!d||!(o>0)||!(r>=1&&r<=5))fl="Isi driver, jumlah order (>0), dan rating (1 sampai 5).";
  else{const n=Math.max(0,...S.trx.map(t=>parseInt(t.id.slice(3))||0))+1;S.trx.push({id:"TRX"+String(n).padStart(3,"0"),tgl:$("ft").value,d,o,r});fl="Transaksi ditambahkan."}}
 else if(a==="delT"){S.trx=S.trx.filter(t=>t.id!==b.dataset.i)}
 else if(a==="rs"){S=DEF();fl=""}
 else if(a==="cp"){const x=calc().find(d=>d.id===sel);if(!x)return;
  const t=["SLIP GAJI DIGITAL - OMNIGO","Periode: Oktober 2026","Nama: "+x.n,"Layanan: "+x.sv.n,"Order/trip: "+x.o,"Pendapatan dasar: "+rp(x.base),"Insentif: "+rp(x.inc),"Bonus: "+rp(x.bon),"Potongan admin: "+rp(x.adm),"Denda: "+rp(x.den),"PENDAPATAN BERSIH: "+rp(x.net)].join("\n");
  const m=$("m");try{navigator.clipboard.writeText(t).then(()=>m.textContent="Slip tersalin.",()=>m.textContent="Gagal menyalin.")}catch(err){m.textContent="Gagal menyalin."}return}
 save();render()});
$("v").addEventListener("change",e=>{const t=e.target;
 if(t.id==="ss"){sel=t.value;render();return}
 if(t.dataset.p)S.par[t.dataset.p]=+t.value;
 else if(t.dataset.s){const[k,f]=t.dataset.s.split(".");S.svc[k][f]=+t.value}
 else return;save()});
show(ss);
</script>
</body>
 </html>
